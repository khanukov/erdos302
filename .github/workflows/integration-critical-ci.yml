name: Integration critical path on high-memory CI

on:
  push:
    branches: [agent/integration-ci]
    paths:
      - ".github/workflows/integration-critical-ci.yml"
      - "Erdos302/Generated/PackingCertificateLevelsNat*.lean"
      - "Erdos302/Generated/SemanticPackingChecks*.lean"
      - "Erdos302/Generated/SemanticChecks.lean"
      - "Erdos302/SemanticBridge.lean"
      - "Erdos302/Packing/PrefixTransport.lean"
      - "Erdos302/Packing/PrefixTransportCore.lean"
      - "Erdos302/Packing/PrefixOmission.lean"
      - "Erdos302/Asymptotic.lean"
      - "Erdos302/Asymptotic/Integration.lean"
      - "scripts/generate_packing_level_bridge.py"
      - "scripts/generate_semantic_packing_bridge.py"
      - "scripts/audit_lean_sources.py"
      - "scripts/verify_integration_overlay.py"
  workflow_dispatch:
    inputs:
      semantic_run_id:
        description: "Completed run containing a verified semantic-stage artifact"
        required: false
        type: string
      artifact_sha:
        description: "Commit SHA used to name and build that artifact"
        required: false
        type: string

permissions:
  contents: read

env:
  STAGING_TAG: integration-overlay-20260907

jobs:
  semantic-stage:
    if: ${{ github.event_name != 'workflow_dispatch' || inputs.semantic_run_id == '' }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: false
          use-github-cache: false
      - name: Report resources
        run: |
          nproc
          free -h
          df -h .
          lean --version
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Download verified integration overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging-parts
          gh release download "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'integration-overlay.part-*' --dir staging-parts
          python3 - <<'PY'
          from pathlib import Path
          parts=sorted(Path('staging-parts').glob('integration-overlay.part-*'))
          if not parts: raise SystemExit('no staging parts')
          with open('integration-overlay.tar.zst','wb') as out:
              for p in parts: out.write(p.read_bytes())
          print({'parts':len(parts),'bytes':Path('integration-overlay.tar.zst').stat().st_size})
          PY
          zstd -t integration-overlay.tar.zst
          zstd -d -q -c integration-overlay.tar.zst | tar -xf -
          python3 scripts/verify_integration_overlay.py
      - name: Regenerate bridge and require exact source
        run: |
          set -euo pipefail
          before=$(sha256sum Erdos302/Generated/PackingCertificateLevelsNat*.lean | sha256sum)
          semantic_before=$(sha256sum Erdos302/Generated/SemanticPackingChecks*.lean Erdos302/Generated/SemanticChecks.lean | sha256sum)
          python3 scripts/generate_packing_level_bridge.py
          python3 scripts/generate_semantic_packing_bridge.py
          after=$(sha256sum Erdos302/Generated/PackingCertificateLevelsNat*.lean | sha256sum)
          semantic_after=$(sha256sum Erdos302/Generated/SemanticPackingChecks*.lean Erdos302/Generated/SemanticChecks.lean | sha256sum)
          test "$before" = "$after"
          test "$semantic_before" = "$semantic_after"
      - name: Compile semantic stage with Lean kernel
        run: |
          set -euo pipefail
          compile() {
            src="$1"
            mod="${src%.lean}"
            mkdir -p ".lake/build/lib/lean/$(dirname "$mod")"
            /usr/bin/time -v lake env lean -s 1048576 "$src" \
              -o ".lake/build/lib/lean/${mod}.olean" \
              -i ".lake/build/lib/lean/${mod}.ilean" \
              2>&1 | tee "$(basename "$mod").log"
            test -s ".lake/build/lib/lean/${mod}.olean"
            test -s ".lake/build/lib/lean/${mod}.ilean"
          }
          compile Erdos302/Generated/PackingCertificateLevelsNat.lean
          compile Erdos302/Valuation.lean
          compile Erdos302/Asymptotic/PeriodicCount.lean
          compile Erdos302/Asymptotic/Multipliers.lean
          compile Erdos302/Asymptotic/FiniteOmission.lean
          compile Erdos302/Asymptotic/Thresholds.lean
          compile Erdos302/Asymptotic/ShiftSum.lean
          compile Erdos302/Asymptotic/Interface.lean
          compile Erdos302/SemanticBridge.lean
          compile Erdos302/Generated/SemanticPackingChecksCore.lean
          for i in $(seq 0 13); do
            compile "Erdos302/Generated/SemanticPackingChecksGroup${i}.lean"
          done
          compile Erdos302/Generated/SemanticChecks.lean
      - name: Pack semantic stage outputs
        run: |
          set -euo pipefail
          tar -cf semantic-stage.tar \
            .lake/build/lib/lean/Erdos302/Generated/PackingCertificateLevelsNat.{o,i}lean \
            .lake/build/lib/lean/Erdos302/Valuation.{o,i}lean \
            .lake/build/lib/lean/Erdos302/Asymptotic/PeriodicCount.{o,i}lean \
            .lake/build/lib/lean/Erdos302/Asymptotic/Multipliers.{o,i}lean \
            .lake/build/lib/lean/Erdos302/Asymptotic/FiniteOmission.{o,i}lean \
            .lake/build/lib/lean/Erdos302/Asymptotic/Thresholds.{o,i}lean \
            .lake/build/lib/lean/Erdos302/Asymptotic/ShiftSum.{o,i}lean \
            .lake/build/lib/lean/Erdos302/Asymptotic/Interface.{o,i}lean \
            .lake/build/lib/lean/Erdos302/SemanticBridge.{o,i}lean \
            .lake/build/lib/lean/Erdos302/Generated/SemanticPackingChecks*.olean \
            .lake/build/lib/lean/Erdos302/Generated/SemanticPackingChecks*.ilean \
            .lake/build/lib/lean/Erdos302/Generated/SemanticChecks.{o,i}lean
          zstd -T0 -10 semantic-stage.tar -o semantic-stage.tar.zst
          zstd -t semantic-stage.tar.zst
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: semantic-stage-${{ github.sha }}
          path: semantic-stage.tar.zst
          if-no-files-found: error
          retention-days: 3

  downstream:
    needs: semantic-stage
    if: ${{ always() && (needs.semantic-stage.result == 'success' || inputs.semantic_run_id != '') }}
    runs-on: ubuntu-24.04
    timeout-minutes: 360
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: false
          use-github-cache: false
      - name: Fetch Mathlib cache
        run: lake exe cache get
      - name: Download verified integration overlay
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p staging-parts
          gh release download "$STAGING_TAG" --repo "$GITHUB_REPOSITORY" --pattern 'integration-overlay.part-*' --dir staging-parts
          python3 - <<'PY'
          from pathlib import Path
          parts=sorted(Path('staging-parts').glob('integration-overlay.part-*'))
          if not parts: raise SystemExit('no staging parts')
          with open('integration-overlay.tar.zst','wb') as out:
              for p in parts: out.write(p.read_bytes())
          PY
          zstd -t integration-overlay.tar.zst
          zstd -d -q -c integration-overlay.tar.zst | tar -xf -
          python3 scripts/verify_integration_overlay.py
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: semantic-stage-${{ inputs.artifact_sha || github.sha }}
          path: semantic-stage-download
          run-id: ${{ inputs.semantic_run_id || github.run_id }}
          github-token: ${{ github.token }}
      - name: Verify reused stage source provenance
        if: ${{ inputs.semantic_run_id != '' }}
        env:
          ARTIFACT_SHA: ${{ inputs.artifact_sha }}
        run: |
          set -euo pipefail
          test -n "$ARTIFACT_SHA"
          git fetch origin "$ARTIFACT_SHA" --depth=1
          git diff --quiet "$ARTIFACT_SHA" HEAD -- \
            Erdos302/Generated/PackingCertificateLevelsNat*.lean \
            Erdos302/Generated/SemanticPackingChecks*.lean \
            Erdos302/Generated/SemanticChecks.lean \
            Erdos302/SemanticBridge.lean \
            Erdos302/Valuation.lean \
            Erdos302/Asymptotic/PeriodicCount.lean \
            Erdos302/Asymptotic/Multipliers.lean \
            Erdos302/Asymptotic/FiniteOmission.lean \
            Erdos302/Asymptotic/Thresholds.lean \
            Erdos302/Asymptotic/ShiftSum.lean \
            Erdos302/Asymptotic/Interface.lean \
            scripts/generate_packing_level_bridge.py \
            scripts/generate_semantic_packing_bridge.py
      - name: Verify and restore semantic stage
        run: |
          set -euo pipefail
          zstd -t semantic-stage-download/semantic-stage.tar.zst
          zstd -d -q -c semantic-stage-download/semantic-stage.tar.zst | tar -xf -
          test -s .lake/build/lib/lean/Erdos302/Generated/SemanticChecks.olean
      - name: Add bounded swap for combined proof closures
        run: |
          set -euo pipefail
          sudo fallocate -l 32G /swapfile-extra
          sudo chmod 600 /swapfile-extra
          sudo mkswap /swapfile-extra
          sudo swapon /swapfile-extra
          free -h
      - name: Reject project-local proof escapes
        run: python3 scripts/audit_lean_sources.py
      - name: Compile downstream critical path with Lean kernel
        run: |
          set -euo pipefail
          compile() {
            src="$1"
            mod="${src%.lean}"
            mkdir -p ".lake/build/lib/lean/$(dirname "$mod")"
            /usr/bin/time -v lake env lean -s 1048576 "$src" \
              -o ".lake/build/lib/lean/${mod}.olean" \
              -i ".lake/build/lib/lean/${mod}.ilean" \
              2>&1 | tee "$(basename "$mod").log"
            test -s ".lake/build/lib/lean/${mod}.olean"
            test -s ".lake/build/lib/lean/${mod}.ilean"
          }
          compile Erdos302/Packing/PrefixTransportCore.lean
          compile Erdos302/Packing/PrefixTransport.lean
          compile Erdos302/Packing/PrefixOmission.lean
          compile Erdos302/Asymptotic/Endpoint.lean
          compile Erdos302/Asymptotic/Integration.lean
          compile Erdos302/Asymptotic.lean
      - name: Audit final theorem axioms
        run: |
          set -euo pipefail
          cat > AxiomAudit.lean <<'EOF'
          import Erdos302.Asymptotic
          #print axioms Erdos302.Packing.prefix_omission_certificate
          #print axioms Erdos302.Asymptotic.erdos302Certificate_holds
          #print axioms Erdos302.Asymptotic.erdos_302_upper_140803024_163562355
          EOF
          lake env lean -s 1048576 AxiomAudit.lean 2>&1 | tee AxiomAudit.log
          python3 - <<'PY'
          import re
          from pathlib import Path
          text = Path('AxiomAudit.log').read_text()
          found = re.findall(r"depends on axioms: (\[[^\n]*\])", text)
          expected = '[propext, Classical.choice, Quot.sound]'
          if found != [expected, expected, expected]:
              raise SystemExit(f'unexpected axiom audit: {found!r}')
          print('axiom_audit_green declarations=3 trusted=' + expected)
          PY
      - name: Build output manifest
        run: |
          python3 - <<'PY'
          import hashlib,json,subprocess
          from pathlib import Path
          stems=[
            'Erdos302/Generated/PackingCertificateLevelsNat',
            'Erdos302/Valuation',
            'Erdos302/Asymptotic/PeriodicCount',
            'Erdos302/Asymptotic/Multipliers',
            'Erdos302/Asymptotic/FiniteOmission',
            'Erdos302/Asymptotic/Thresholds',
            'Erdos302/Asymptotic/ShiftSum',
            'Erdos302/Asymptotic/Interface',
            'Erdos302/SemanticBridge',
            'Erdos302/Generated/SemanticPackingChecksCore',
            *[f'Erdos302/Generated/SemanticPackingChecksGroup{i}' for i in range(14)],
            'Erdos302/Generated/SemanticChecks',
            'Erdos302/Packing/PrefixTransportCore',
            'Erdos302/Packing/PrefixTransport',
            'Erdos302/Packing/PrefixOmission',
            'Erdos302/Asymptotic/Endpoint',
            'Erdos302/Asymptotic/Integration',
            'Erdos302/Asymptotic',
          ]
          files=[Path('.lake/build/lib/lean')/(s+ext) for s in stems for ext in ('.olean','.ilean')]
          def h(p): return hashlib.sha256(p.read_bytes()).hexdigest()
          m={'schema':1,'commit':subprocess.check_output(['git','rev-parse','HEAD'],text=True).strip(),'lean':subprocess.check_output(['lean','--version'],text=True).splitlines()[0],'axiom_audit_sha256':h(Path('AxiomAudit.log')),'files':[{'path':str(p),'bytes':p.stat().st_size,'sha256':h(p)} for p in files]}
          Path('INTEGRATION-MANIFEST.json').write_text(json.dumps(m,indent=2)+'\n')
          PY
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: integration-critical-${{ github.sha }}
          path: |
            .lake/build/lib/lean/Erdos302/Generated/PackingCertificateLevelsNat.olean
            .lake/build/lib/lean/Erdos302/Generated/PackingCertificateLevelsNat.ilean
            .lake/build/lib/lean/Erdos302/Valuation.olean
            .lake/build/lib/lean/Erdos302/Valuation.ilean
            .lake/build/lib/lean/Erdos302/SemanticBridge.olean
            .lake/build/lib/lean/Erdos302/SemanticBridge.ilean
            .lake/build/lib/lean/Erdos302/Generated/SemanticPackingChecks*.olean
            .lake/build/lib/lean/Erdos302/Generated/SemanticPackingChecks*.ilean
            .lake/build/lib/lean/Erdos302/Generated/SemanticChecks.olean
            .lake/build/lib/lean/Erdos302/Generated/SemanticChecks.ilean
            .lake/build/lib/lean/Erdos302/Asymptotic/*.olean
            .lake/build/lib/lean/Erdos302/Asymptotic/*.ilean
            .lake/build/lib/lean/Erdos302/Packing/PrefixTransport.olean
            .lake/build/lib/lean/Erdos302/Packing/PrefixTransport.ilean
            .lake/build/lib/lean/Erdos302/Packing/PrefixTransportCore.olean
            .lake/build/lib/lean/Erdos302/Packing/PrefixTransportCore.ilean
            .lake/build/lib/lean/Erdos302/Asymptotic.olean
            .lake/build/lib/lean/Erdos302/Asymptotic.ilean
            .lake/build/lib/lean/Erdos302/Packing/PrefixOmission.olean
            .lake/build/lib/lean/Erdos302/Packing/PrefixOmission.ilean
            INTEGRATION-MANIFEST.json
            AxiomAudit.log
            *.log
          if-no-files-found: error
          include-hidden-files: true
          retention-days: 3
