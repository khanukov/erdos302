name: Publish priority preprint

on:
  workflow_run:
    workflows: [Verify]
    types: [completed]

permissions:
  contents: write
  actions: read

concurrency:
  group: publish-preprint-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - name: Check out the exact verified main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}

      - name: Validate or publish the verified main-run artifact
        env:
          GH_TOKEN: ${{ github.token }}
          VERIFIED_SHA: ${{ github.event.workflow_run.head_sha }}
          SOURCE_RUN_ID: ${{ github.event.workflow_run.id }}
        run: |
          set -euo pipefail

          tag="$(cat release/PREPRINT_TAG)"
          version="$(cat release/PREPRINT_VERSION)"
          publish_ready="$(cat release/PUBLISH_READY)"
          preprint_doi="$(cat release/PREPRINT_DOI)"
          concept_doi="$(cat release/CONCEPT_DOI)"
          readonly tag version publish_ready preprint_doi concept_doi

          python3 -I -S scripts/build_preprint_release.py --check-controls-only

          if [[ "${publish_ready}" == "false" ]]; then
            echo "publication gate is closed for ${version} (${tag}); no release action"
            exit 0
          fi
          if [[ "${publish_ready}" != "true" ]]; then
            echo "release/PUBLISH_READY must contain exactly true or false" >&2
            exit 1
          fi
          if [[ "${version}" == *-dev ]]; then
            echo "refusing to publish development version ${version}" >&2
            exit 1
          fi

          readonly artifact="erdos302-v${version}-candidate"

          tag_target() {
            local direct peeled
            direct="$(
              git ls-remote --tags origin "refs/tags/${tag}" |
                awk 'NR == 1 {print $1}'
            )"
            peeled="$(
              git ls-remote --tags origin "refs/tags/${tag}^{}" |
                awk 'NR == 1 {print $1}'
            )"
            if [[ -z "${direct}" ]]; then
              printf '\n'
              return 0
            fi
            if [[ -z "${peeled}" ]]; then
              echo "tag ${tag} exists but is not an annotated tag" >&2
              return 1
            fi
            printf '%s\n' "${peeled}"
          }

          validate_verify_run() {
            local run_id="$1"
            local expected_sha="$2"
            local run_api source_name source_conclusion source_sha
            local source_event source_branch
            run_api="/repos/${GITHUB_REPOSITORY}/actions/runs/${run_id}"
            source_name="$(gh api "${run_api}" --jq .name)"
            source_conclusion="$(gh api "${run_api}" --jq .conclusion)"
            source_sha="$(gh api "${run_api}" --jq .head_sha)"
            source_event="$(gh api "${run_api}" --jq .event)"
            source_branch="$(gh api "${run_api}" --jq .head_branch)"
            if [[ "${source_name}" != "Verify" || \
                  "${source_conclusion}" != "success" || \
                  "${source_sha}" != "${expected_sha}" || \
                  "${source_event}" != "push" || \
                  "${source_branch}" != "main" ]]; then
              echo "Verify run ${run_id} is not a successful main push for ${expected_sha}" >&2
              return 1
            fi
          }

          validate_asset_directory() {
            local directory="$1"
            local actual_list listed_list
            actual_list="$(mktemp "${RUNNER_TEMP}/actual-assets.XXXXXX")"
            listed_list="$(mktemp "${RUNNER_TEMP}/listed-assets.XXXXXX")"
            (
              cd "${directory}"
              test -s GITHUB_RELEASE_SHA256SUMS.txt
              if find . -mindepth 1 -maxdepth 1 ! -type f -print -quit |
                  grep -q .; then
                echo "asset directory contains a non-ordinary file" >&2
                return 1
              fi
              python3 - GITHUB_RELEASE_SHA256SUMS.txt <<'PY'
          import re
          import sys
          from pathlib import Path

          manifest = Path(sys.argv[1])
          names = []
          for number, line in enumerate(manifest.read_text(encoding="utf-8").splitlines(), 1):
              match = re.fullmatch(r"[0-9a-f]{64}  ([A-Za-z0-9][A-Za-z0-9._-]*)", line)
              if match is None:
                  raise SystemExit(f"unsafe manifest line {number}: {line!r}")
              names.append(match.group(1))
          if not names or len(names) != len(set(names)):
              raise SystemExit("manifest must contain a non-empty unique basename inventory")
          if "GITHUB_RELEASE_SHA256SUMS.txt" in names:
              raise SystemExit("external manifest must not list itself")
          PY
              sha256sum --strict -c GITHUB_RELEASE_SHA256SUMS.txt
              find . -maxdepth 1 -type f \
                ! -name GITHUB_RELEASE_SHA256SUMS.txt \
                -printf '%f\n' | LC_ALL=C sort >"${actual_list}"
              awk '{name=$2; sub(/^\*/, "", name); print name}' \
                GITHUB_RELEASE_SHA256SUMS.txt | LC_ALL=C sort >"${listed_list}"
              diff -u "${listed_list}" "${actual_list}"
            )
            rm "${actual_list}" "${listed_list}"
          }

          validate_release() {
            local expected_draft="$1"
            local expected_manifest="${2:-}"
            local draft prerelease release_tag published_dir published_sha
            local published_tree published_ci run_prefix published_run_id
            local anchor_dir state
            state="$(
              gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                --json isDraft,isPrerelease,tagName
            )"
            draft="$(jq -er '.isDraft | tostring' <<<"${state}")"
            prerelease="$(jq -er '.isPrerelease | tostring' <<<"${state}")"
            release_tag="$(jq -er '.tagName' <<<"${state}")"
            if [[ "${draft}" != "${expected_draft}" || \
                  "${prerelease}" != "true" || \
                  "${release_tag}" != "${tag}" ]]; then
              echo "release ${tag} does not have expected draft=${expected_draft}, prerelease=true state" >&2
              return 1
            fi

            published_dir="$(mktemp -d "${RUNNER_TEMP}/published-preprint.XXXXXX")"
            gh release download "${tag}" --repo "${GITHUB_REPOSITORY}" \
              --dir "${published_dir}"
            validate_asset_directory "${published_dir}"
            published_sha="$(sed -n 's/^commit //p' \
              "${published_dir}/COMMIT_SHA.txt")"
            published_tree="$(sed -n 's/^tree //p' \
              "${published_dir}/COMMIT_SHA.txt")"
            published_ci="$(sed -n 's/^ci-run //p' \
              "${published_dir}/COMMIT_SHA.txt")"
            if [[ ! "${published_sha}" =~ ^[0-9a-f]{40}$ || \
                  ! "${published_tree}" =~ ^[0-9a-f]{40}$ ]]; then
              echo "release COMMIT_SHA.txt has malformed commit/tree data" >&2
              return 1
            fi
            if [[ "$(tag_target)" != "${published_sha}" ]]; then
              echo "release tag does not resolve to its recorded commit" >&2
              return 1
            fi
            if [[ "$(gh api "/repos/${GITHUB_REPOSITORY}/git/commits/${published_sha}" \
                    --jq .tree.sha)" != "${published_tree}" ]]; then
              echo "release tree does not match its recorded commit" >&2
              return 1
            fi

            run_prefix="https://github.com/${GITHUB_REPOSITORY}/actions/runs/"
            if [[ "${published_ci}" != "${run_prefix}"* ]]; then
              echo "release records an unexpected CI URL: ${published_ci}" >&2
              return 1
            fi
            published_run_id="${published_ci#"${run_prefix}"}"
            if [[ ! "${published_run_id}" =~ ^[0-9]+$ ]]; then
              echo "release records a malformed CI run ID" >&2
              return 1
            fi
            if [[ "${expected_draft}" == "true" && \
                  ( "${published_sha}" != "${VERIFIED_SHA}" || \
                    "${published_run_id}" != "${SOURCE_RUN_ID}" ) ]]; then
              echo "draft release is not anchored to the current Verify trigger" >&2
              return 1
            fi
            validate_verify_run "${published_run_id}" "${published_sha}"

            if [[ -z "${expected_manifest}" ]]; then
              anchor_dir="$(mktemp -d "${RUNNER_TEMP}/recorded-run-artifact.XXXXXX")"
              if ! gh run download "${published_run_id}" \
                --repo "${GITHUB_REPOSITORY}" --name "${artifact}" \
                --dir "${anchor_dir}"; then
                echo "recorded Verify artifact ${artifact} from run ${published_run_id} is unavailable; refusing self-manifest validation" >&2
                return 1
              fi
              validate_asset_directory "${anchor_dir}"
              grep -Fqx "commit ${published_sha}" "${anchor_dir}/COMMIT_SHA.txt"
              grep -Fqx "ci-run ${published_ci}" "${anchor_dir}/COMMIT_SHA.txt"
              expected_manifest="${anchor_dir}/GITHUB_RELEASE_SHA256SUMS.txt"
            fi
            cmp -- "${expected_manifest}" \
              "${published_dir}/GITHUB_RELEASE_SHA256SUMS.txt"

            grep -Fqx -- "version: ${version}" "${published_dir}/VERIFICATION.txt"
            grep -Fqx -- "tag: ${tag}" "${published_dir}/VERIFICATION.txt"
            grep -Fqx -- "version DOI: ${preprint_doi}" \
              "${published_dir}/VERIFICATION.txt"
            grep -Fqx -- "concept DOI: ${concept_doi}" \
              "${published_dir}/VERIFICATION.txt"
            grep -Fqx -- "publication gate: true" \
              "${published_dir}/VERIFICATION.txt"
            grep -Fqx -- "commit: ${published_sha}" "${published_dir}/VERIFICATION.txt"
            grep -Fqx -- "CI run: ${published_ci}" \
              "${published_dir}/VERIFICATION.txt"
            echo "release ${tag} draft=${expected_draft} passed tag, recorded-run artifact, asset, and digest validation"
          }

          releases_json="$(mktemp "${RUNNER_TEMP}/releases.XXXXXX.json")"
          gh api --paginate --slurp \
            "/repos/${GITHUB_REPOSITORY}/releases?per_page=100" >"${releases_json}"
          match_count="$(
            jq -er --arg tag "${tag}" \
              '[.[][] | select(.tag_name == $tag)] | length' "${releases_json}"
          )"
          if [[ "${match_count}" == "1" ]]; then
            existing_draft="$(
              gh release view "${tag}" --repo "${GITHUB_REPOSITORY}" \
                --json isDraft --jq '.isDraft | tostring'
            )"
            if [[ "${existing_draft}" == "true" ]]; then
              validate_release true
              gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" \
                --draft=false --prerelease
              validate_release false
            elif [[ "${existing_draft}" == "false" ]]; then
              validate_release false
            else
              echo "release ${tag} has invalid draft state ${existing_draft}" >&2
              exit 1
            fi
            exit 0
          elif [[ "${match_count}" != "0" ]]; then
            echo "multiple GitHub releases claim tag ${tag}" >&2
            exit 1
          fi

          validate_verify_run "${SOURCE_RUN_ID}" "${VERIFIED_SHA}"

          readonly assets_dir="${RUNNER_TEMP}/preprint-assets"
          mkdir -p "${assets_dir}"
          gh run download "${SOURCE_RUN_ID}" --repo "${GITHUB_REPOSITORY}" \
            --name "${artifact}" --dir "${assets_dir}"
          validate_asset_directory "${assets_dir}"
          grep -Fqx "commit ${VERIFIED_SHA}" "${assets_dir}/COMMIT_SHA.txt"
          grep -Fqx \
            "ci-run https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            "${assets_dir}/COMMIT_SHA.txt"
          grep -Fqx -- "version: ${version}" "${assets_dir}/VERIFICATION.txt"
          grep -Fqx -- "tag: ${tag}" "${assets_dir}/VERIFICATION.txt"
          grep -Fqx -- "version DOI: ${preprint_doi}" \
            "${assets_dir}/VERIFICATION.txt"
          grep -Fqx -- "concept DOI: ${concept_doi}" \
            "${assets_dir}/VERIFICATION.txt"
          grep -Fqx -- "publication gate: true" \
            "${assets_dir}/VERIFICATION.txt"
          grep -Fqx -- "commit: ${VERIFIED_SHA}" \
            "${assets_dir}/VERIFICATION.txt"
          grep -Fqx -- \
            "CI run: https://github.com/${GITHUB_REPOSITORY}/actions/runs/${SOURCE_RUN_ID}" \
            "${assets_dir}/VERIFICATION.txt"

          remote_tag_sha="$(tag_target)"
          if [[ -n "${remote_tag_sha}" && "${remote_tag_sha}" != "${VERIFIED_SHA}" ]]; then
            echo "refusing to rewrite tag ${tag}: ${remote_tag_sha} != ${VERIFIED_SHA}" >&2
            exit 1
          fi
          if [[ -z "${remote_tag_sha}" ]]; then
            git config user.name github-actions[bot]
            git config user.email 41898282+github-actions[bot]@users.noreply.github.com
            git tag -a "${tag}" "${VERIFIED_SHA}" \
              -m "Erdos 302 preliminary unrefereed preprint ${version}"
            git push origin "refs/tags/${tag}"
          fi

          gh release create "${tag}" "${assets_dir}"/* \
            --repo "${GITHUB_REPOSITORY}" \
            --verify-tag \
            --draft \
            --prerelease \
            --title "Erdos 302 priority preprint ${version}" \
            --notes-file "${assets_dir}/RELEASE_NOTES.md"

          validate_release true \
            "${assets_dir}/GITHUB_RELEASE_SHA256SUMS.txt"
          gh release edit "${tag}" --repo "${GITHUB_REPOSITORY}" \
            --draft=false --prerelease
          validate_release false \
            "${assets_dir}/GITHUB_RELEASE_SHA256SUMS.txt"
