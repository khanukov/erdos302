name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true
          # Mathlib provides its own binary cache; caching the complete .lake
          # directory here would consume several gigabytes for this project.
          use-github-cache: false
      # Updating from the pinned lakefile must reproduce the committed lockfile.
      - run: lake update
      - run: git diff --exit-code -- lake-manifest.json

  exact-certificate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m py_compile scripts/verify_certificate.py scripts/milp_crosscheck.py
      # -O is intentional: proof obligations must not depend on `assert`.
      - run: python3 -O scripts/verify_certificate.py

  milp-crosscheck:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          # setup-python otherwise searches only for conventional dependency
          # files such as requirements.txt, while this job intentionally keeps
          # its optional SciPy dependencies in a dedicated requirements file.
          cache-dependency-path: requirements-crosscheck.txt
      - run: python3 -m pip install -r requirements-crosscheck.txt
      - run: python3 scripts/milp_crosscheck.py
