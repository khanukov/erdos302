name: Verify

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  lean:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: leanprover/lean-action@v1
        with:
          build: true

  exact-certificate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python3 -m py_compile scripts/verify_certificate.py
      # -O is intentional: proof obligations must not depend on `assert`.
      - run: python3 -O scripts/verify_certificate.py

  milp-crosscheck:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
      - run: python3 -m pip install -r requirements-crosscheck.txt
      - run: python3 scripts/milp_crosscheck.py
