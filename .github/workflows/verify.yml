name: Verify

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ["v*"]

concurrency:
  group: verify-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  root-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          build: true
          use-github-cache: false
      - run: MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
      - run: git diff --exit-code -- lake-manifest.json

  q3360-exact:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Verify canonical base module under optimized Python
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I -S -O certificates/q3360/exact_certificate.py
      - name: Run independent exhaustive implementation
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I -S -O scripts/verify_certificate.py
      - run: test -z "$(git status --porcelain)"

  hierarchical-upper:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Check committed upper payload hashes
        run: |
          cd certificates/q139708800
          sha256sum -c SHA256SUMS
      - run: |
          python3 -m py_compile \
            certificates/q3360/exact_certificate.py \
            certificates/q139708800/hierarchical_certificate.py
      - name: Verify in isolated normal mode
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -S certificates/q139708800/hierarchical_certificate.py verify \
            certificates/q139708800/certificate.json \
            --base-verifier certificates/q3360/exact_certificate.py
      - name: Verify in isolated optimized mode
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          python3 -I -S -O certificates/q139708800/hierarchical_certificate.py verify \
            certificates/q139708800/certificate.json \
            --base-verifier certificates/q3360/exact_certificate.py
      - run: test -z "$(git status --porcelain)"

  upper-mutation-tests:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Require rejection of four corrupted proof layers
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I -S -O scripts/test_upper_mutations.py
      - run: test -z "$(git status --porcelain)"

  milp-crosscheck:
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-crosscheck.txt
      - run: python3 -m pip install -r requirements-crosscheck.txt
      - run: python3 scripts/milp_crosscheck.py
      - run: test -z "$(git status --porcelain)"

  lower-lean:
    runs-on: ubuntu-24.04
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: leanprover/lean-action@38fbc41a8c28c4cbaec22d7f7de508ec2e7c0dd9 # v1
        with:
          lake-package-directory: lower-lean
          build: false
          use-github-cache: false
          use-mathlib-cache: false
      - name: Reproduce dependency lockfile
        run: |
          cd lower-lean
          MATHLIB_NO_CACHE_ON_UPDATE=1 lake update
          git diff --exit-code -- lake-manifest.json
      - name: Fetch the pinned Mathlib binary cache
        run: |
          cd lower-lean
          lake exe cache get
      - name: Build the exact lower project
        run: |
          cd lower-lean
          lake build
      - name: Reject proof escapes
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I -S scripts/audit_lower_sources.py
      - name: Reproduce axiom report
        run: |
          cd lower-lean
          lake env lean Erdos302Lower/Axioms.lean | tee /tmp/erdos302-axioms.txt
          diff -u AXIOMS.txt /tmp/erdos302-axioms.txt
      - run: test -z "$(git status --porcelain)"

  paper:
    # The manuscript PDF is produced only after every proof-boundary job passes.
    needs: [root-lean, q3360-exact, hierarchical-upper, upper-mutation-tests, lower-lean]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - name: Install TeX
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk texlive-latex-base texlive-latex-recommended \
            texlive-fonts-recommended
      - name: Build manuscript
        run: |
          latexmk -cd -pdf -interaction=nonstopmode -halt-on-error \
            -file-line-error paper/erdos302_two_sided.tex
      - name: Check publication wording
        run: |
          test -f LICENSE
          test -f LICENSE_SCOPE.md
          test -f paper/LICENSE
          grep -Fq 'MIT License' LICENSE
          grep -Fq 'SPDX-License-Identifier: CC-BY-4.0' paper/LICENSE
          grep -Fq 'license: MIT' CITATION.cff
          ! grep -nE 'Author name|author placeholder|fully Lean verified' \
            paper/erdos302_two_sided.tex
          ! grep -nF -e '5273/6048' -e '\frac{5273}{6048}' \
            paper/erdos302_two_sided.tex
          grep -Fq '\frac{373}{420}' paper/erdos302_two_sided.tex
          grep -Fq '\frac{25}{28}' paper/erdos302_two_sided.tex
          grep -Fq 'Partial302Pastebin2026' paper/erdos302_two_sided.tex
          grep -Fq '\cite{Erdos301}' paper/erdos302_two_sided.tex
          grep -Fq '@misc{Erdos301,' paper/references.bib
          for source in README.md docs/Q_SEARCH_REPORT.md \
              paper/erdos302_two_sided.tex; do
            grep -Fq \
              '\frac{140803024}{163562355}<\frac{373}{420}<\frac{25}{28}<\frac9{10}' \
              "$source"
          done
          grep -Fq 'The lower statement is unconditional' \
            paper/erdos302_two_sided.tex
          ! grep -inE \
            'assuming[[:space:]]+Della Pietra|conditional (on|upon).{0,80}Della Pietra' \
            README.md paper/erdos302_two_sided.tex
          ! grep -nF 'proof claim' README.md REPRODUCIBILITY.md
          grep -Fq 'engineering integration event:' \
            README.md
          grep -Fq 'GitHub/Zenodo release' paper/erdos302_two_sided.tex
          grep -Fq 'Preliminary and unrefereed' README.md
          grep -Fq 'Preliminary and unrefereed' \
            paper/erdos302_two_sided.tex
          grep -Fq '## Preliminary release policy' README.md
          grep -Fq '## Scientific validation policy' README.md
          grep -Fq '0.1.0-preprint' CITATION.cff
          test "$(cat release/PREPRINT_TAG)" = \
            'v0.1.0-priority-preprint'
          python3 -m py_compile scripts/build_preprint_release.py
          ! grep -inE \
            'must (also )?remain draft|pull request remains draft|No repository license is selected|No `LICENSE` is supplied' \
            README.md docs/INDEPENDENT_REVIEW.md \
            docs/LOWER_RELEASE_RESTORATION.md docs/TRUST_BOUNDARY.md \
            paper/erdos302_two_sided.tex
          ! grep -inE \
            'no (GitHub Release|arXiv).{0,100}until.{0,100}(human|review)|required before (a )?(GitHub Release|arXiv)' \
            README.md docs/INDEPENDENT_REVIEW.md \
            docs/LOWER_RELEASE_RESTORATION.md docs/TRUST_BOUNDARY.md \
            paper/erdos302_two_sided.tex
          ! grep -Eq \
            'LaTeX Warning: (Citation|Reference).+undefined|There were undefined (references|citations)' \
            paper/erdos302_two_sided.log
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erdos302-two-sided-manuscript
          path: paper/erdos302_two_sided.pdf
          if-no-files-found: error

  preprint-bundle:
    # This artifact exists only after every proof, regression, and paper job.
    needs:
      - root-lean
      - q3360-exact
      - hierarchical-upper
      - upper-mutation-tests
      - milp-crosscheck
      - lower-lean
      - paper
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
      - uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: "3.13"
      - name: Install manuscript and PDF inspection tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            latexmk poppler-utils unzip texlive-latex-base \
            texlive-latex-recommended texlive-fonts-recommended
      - name: Build exact priority-preprint candidate
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: python3 -I -S scripts/build_preprint_release.py --output dist/preprint
      - name: Test packaged standalone and arXiv sources
        env:
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          package_dir="$(mktemp -d)"
          unzip -q dist/preprint/erdos302-v0.1.0-preprint-release.zip \
            -d "${package_dir}"
          cd "${package_dir}/erdos302-0.1.0-preprint"
          python3 -I -S -O exact_certificate.py >/dev/null
          python3 -I -S -O hierarchical_certificate.py verify \
            certificate.json --base-verifier exact_certificate.py >/dev/null
          arxiv_dir="$(mktemp -d)"
          tar -xzf \
            "${GITHUB_WORKSPACE}/dist/preprint/erdos302-v0.1.0-preprint-arxiv.tar.gz" \
            -C "${arxiv_dir}"
          latexmk -cd -pdf -interaction=nonstopmode -halt-on-error \
            -file-line-error "${arxiv_dir}/erdos302_two_sided.tex"
          ! grep -Eq \
            'LaTeX Warning: (Citation|Reference).+undefined|There were undefined (references|citations)|Overfull \\hbox' \
            "${arxiv_dir}/erdos302_two_sided.log"
      - name: Verify release asset hashes
        run: |
          cd dist/preprint
          sha256sum -c GITHUB_RELEASE_SHA256SUMS.txt
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: erdos302-v0.1.0-preprint-candidate
          path: dist/preprint/
          if-no-files-found: error
